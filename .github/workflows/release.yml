name: Release

# Pushes vX.Y.Z on a commit on main. This workflow builds the fabai-seal
# CLI and the WASM bundle reproducibly, attests them, and publishes them
# with their SHA-256. The Go module is the tag itself.
#
#   gh attestation verify fabai-seal.wasm --repo digicatapult/fabai-attestation-verifier \
#     --signer-workflow digicatapult/fabai-attestation-verifier/.github/workflows/release.yml
#
# The published WASM embeds no allowlist, so the demo kiosk's bundle build
# embeds a verified list with scripts/build-wasm.sh.

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false

      - name: Test
        run: go test -tags sealtest ./... && go test ./...

      - name: Build
        run: |
          scripts/build-wasm.sh dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -ldflags='-s -w -buildid=' -o "dist/fabai-seal-${target%/*}-${target#*/}" ./cmd/fabai-seal
          done
          (cd dist && sha256sum fabai-seal.wasm wasm_exec.js seal.mjs fabai-seal-* > SHA256SUMS && cat SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/fabai-seal.wasm
            dist/wasm_exec.js
            dist/seal.mjs
            dist/fabai-seal-*

      - name: Publish release
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes "fabai-seal.wasm SHA-256: $(sha256sum < dist/fabai-seal.wasm | cut -d' ' -f1)"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
